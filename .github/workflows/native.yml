name: Native workstation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev qt6-declarative-dev libpipewire-0.3-dev libasound2-dev qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtqml-workerscript
      - name: Build native application and portable renderer
        run: |
          cmake -S native -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-native
          ctest --test-dir build-native --output-on-failure
      - name: Sanitized engine tests
        run: ./tools/check-core.sh
      - name: QML startup smoke check
        shell: bash
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QT_QUICK_BACKEND=software timeout 5 build-native/eco-workstation > /tmp/eco-ui.log 2>&1
          result=$?
          cat /tmp/eco-ui.log
          test "$result" -eq 124
      - name: Validate kas metadata
        run: |
          python3 -m venv /tmp/eco-kas
          /tmp/eco-kas/bin/pip install 'kas==4.8'
          /tmp/eco-kas/bin/python tools/check-metadata.py
  arm64-core:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/check-core.sh
      - run: ECO_FORCE_SCALAR=1 ./tools/check-core.sh
