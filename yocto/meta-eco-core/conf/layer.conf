BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "eco-core"
BBFILE_PATTERN_eco-core = "^${LAYERDIR}/"
BBFILE_PRIORITY_eco-core = "10"
LAYERSERIES_COMPAT_eco-core = "scarthgap"
LAYERDEPENDS_eco-core = "core openembedded-layer multimedia-layer qt6-layer"
# Keep local source paths independent of kas checkout directory names.
ECO_ROOT := "${LAYERDIR}/../.."
