BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "eco-bsp"
BBFILE_PATTERN_eco-bsp := "^${LAYERDIR}/"
BBFILE_PRIORITY_eco-bsp = "11"
LAYERSERIES_COMPAT_eco-bsp = "scarthgap"
LAYERDEPENDS_eco-bsp = "core eco-core"
# Official BSPs remain authoritative for tunes, firmware, DTBs and boot layouts.
